<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstrucCalc - Perfil de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- 1. BARRA SUPERIOR (HEADER) -->
    <header class="header-dashboard">
        <div class="header-info">
            <img class="logo-header" src="img/logo.png" alt="logo">
            <h1>Bienvenido <span data-sesion="usuario">Usuario</span> ¿Que deseas calcular hoy?</h1>
        </div>
        <!-- Enlace activo de perfil -->
        <a href="perfil.html" class="header-user" style="text-decoration: none; color: white;">
            <p>Perfil</p>
            <i class="fa-solid fa-user"></i>
        </a>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-layout">

        <!-- 2. BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <nav class="menu-calculos">
                
                <a href="muro.html" class="btn-menu">
                    <i class="fa-solid fa-cubes-stacked"></i>
                    Calcular muro
                </a>

                <a href="viga.html" class="btn-menu">
                    <i class="fa-solid fa-bars"></i>
                    Calcular viga
                </a>

                <a href="columnas.html" class="btn-menu">
                    <i class="fa-solid fa-columns"></i>
                    Calcular columnas
                </a>

                <a href="contrapiso.html" class="btn-menu">
                    <i class="fa-solid fa-layer-group"></i>
                    Calcular contrapiso
                </a>

                <a href="techo.html" class="btn-menu">
                    <i class="fa-solid fa-house"></i>
                    Calcular techo
                </a>

                <a href="pisos.html" class="btn-menu">
                    <i class="fa-solid fa-border-all"></i>
                    Calcular pisos
                </a>

                <a href="pintura.html" class="btn-menu">
                    <i class="fa-solid fa-paint-roller"></i>
                    Calcular pintura
                </a>

                <a href="index.html" class="btn-logout">
                    <i class="fa-solid fa-person-walking-arrow-right"></i>
                    Cerrar sesión
                </a>

            </nav>
        </aside>

        <!-- 3. ÁREA DE ACTUALIZACIÓN DE DATOS DEL PERFIL -->
        <main class="content-area">
            <div class="calculator-container">
                
                <div class="card-inputs profile-card">
                    <h3 class="card-title">Actualizancion de Datos</h3>

                    <!-- Avatar y Nombre -->
                    <div class="profile-avatar-container">
                        <div class="profile-avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <h4 class="profile-name" data-sesion="usuario">Jilfred Jimenez Ch.</h4>
                    </div>

                    <!-- Formulario Centrado -->
                    <form class="profile-form">
                        
                        <!-- Campo 1: Correo -->
                        <div class="profile-field">
                            <label class="profile-label">Correo:</label>
                            <input type="email" value="jilfredjimenez456@gmail.com" class="profile-input" data-sesion="correo" readonly>
                        </div>

                        <!-- Campo 2: Cambiar nombre de usuario -->
                        <div class="profile-field">
                            <label class="profile-label">Cambia nombre de usuario:</label>
                            <input type="text" placeholder="ej:jilfred28" class="profile-input">
                        </div>

                        <!-- Campo 3: Reestablecer contraseña -->
                        <div class="profile-field">
                            <label class="profile-label">Reestablecer contraseña:</label>
                            <input type="password" class="profile-input">
                        </div>

                        <!-- Botón Restablecer -->
                        <div class="actions">
                            <button type="submit" class="btn-calc btn-profile-submit">Restablecer</button>
                        </div>

                    </form>

                </div>

            </div>
        </main>

    </div>

    <script src="sesion.js" defer></script>
</body>
</html>
