<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstrucCalc - Calcular Contrapiso</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- 1. BARRA SUPERIOR (HEADER) -->
    <header class="header-dashboard">
        <div class="header-info">
            <img class="logo-header" src="img/logo.png" alt="logo">
            <h1>Bienvenido Usuario ¿Que deseas calcular hoy?</h1>
        </div>
        <div class="header-user">
            <a href="perfil.html" class="header-user" style="text-decoration: none; color: inherit;">
            <p>Perfil</p>
            <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-layout">

        <!-- 2. BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <nav class="menu-calculos">
                
                <a href="muro.html" class="btn-menu">
                    <i class="fa-solid fa-cubes-stacked"></i>
                    Calcular muro
                </a>

                <a href="viga.html" class="btn-menu">
                    <i class="fa-solid fa-bars"></i>
                    Calcular viga
                </a>

                <a href="columnas.html" class="btn-menu">
                    <i class="fa-solid fa-columns"></i>
                    Calcular columnas
                </a>

                <!-- Botón Activo en Contrapiso -->
                <a href="contrapiso.html" class="btn-menu active">
                    <i class="fa-solid fa-layer-group"></i>
                    Calcular contrapiso
                </a>

                <a href="techo.html" class="btn-menu">
                    <i class="fa-solid fa-house"></i>
                    Calcular techo
                </a>

                <a href="pisos.html" class="btn-menu">
                    <i class="fa-solid fa-border-all"></i>
                    Calcular pisos
                </a>

                <a href="pintura.html" class="btn-menu">
                    <i class="fa-solid fa-paint-roller"></i>
                    Calcular pintura
                </a>

                <a href="index.html" class="btn-logout">
                    <i class="fa-solid fa-person-walking-arrow-right"></i>
                    Cerrar sesión
                </a>

            </nav>
        </aside>

        <!-- 3. ÁREA DE CÁLCULO DE CONTRAPISO -->
        <main class="content-area">
            <div class="calculator-container">
                
                <!-- Título principal de la sección -->
                <h2 class="section-title">
                    <i class="fa-solid fa-layer-group" style="color: #d9534f;"></i> Calcular contrapiso
                </h2>

                <!-- Tarjeta Gris de Entrada de Datos -->
                <div class="card-inputs">
                    <h3 class="card-title">Datos del contrapiso</h3>

                    <!-- Fila 1: Espesor -->
                    <div class="form-row">
                        <label for="espesor" class="row-label">Espesor (m):</label>
                        <input type="number" id="espesor" step="0.01" class="calc-input">
                    </div>

                    <!-- Fila 2: Ancho -->
                    <div class="form-row">
                        <label for="ancho" class="row-label">Ancho (m):</label>
                        <input type="number" id="ancho" step="0.01" class="calc-input">
                    </div>

                    <!-- Fila 3: Longitud -->
                    <div class="form-row">
                        <label for="longitud" class="row-label">Longitud (m):</label>
                        <input type="number" id="longitud" step="0.01" class="calc-input">
                    </div>

                    <!-- Botones de Acción -->
                    <div class="actions">
                        <button type="button" class="btn-calc">Calcular</button>
                        <button type="button" class="btn-clear">Limpiar</button>
                    </div>
                </div>

                <!-- Tarjeta Verde de Resultados -->
                <div class="card-results">
                    <h3 class="results-title">Resultado</h3>
                    <div class="results-content">
                        <!-- Aquí se renderizan los resultados con JS -->
                    </div>
                </div>

            </div>
        </main>

    </div>

    <script src="calculos.js" defer></script>
</body>
</html>
