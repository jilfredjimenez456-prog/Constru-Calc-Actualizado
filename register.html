<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ConstrucCalc - Registro</title>
    <meta name="description" content="Calculadora de materiales de construccion">
    <meta name="keywords" content="calculadora,ConstruCalc, materiales, construccion, muro , viga, columnas , contrapiso, techo, pisos,pintura">
    <meta name="author" content="juan pablo devia peña y jilfred jimenez chacon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="login-container">

    <!-- LADO IZQUIERDO: Fondo Azul con la Tarjeta de Registro -->
    <div class="right-panel">
      <div class="login-card">
        <form class="form-login" id="form-registro" novalidate>
          <h2>REGÍSTRATE</h2>

          <!-- Campo Usuario -->
          <div class="circle-user">
            <i class="fa-solid fa-circle-user"></i>
            <input type="text" id="username" name="usuario" placeholder="Usuario" minlength="3" maxlength="20" autocomplete="username" required>
          </div>

          <!-- Campo Correo -->
          <div class="circle-email">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" name="correo" placeholder="Correo" maxlength="60" autocomplete="email" required>
          </div>

          <!-- Campo Contraseña -->
          <div class="circle-password">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Contraseña" minlength="8" maxlength="64" autocomplete="new-password" required>
          </div>

          <div class="circle-password">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirm-password" name="confirmar" placeholder="Confirmar Contraseña" minlength="8" maxlength="64" autocomplete="new-password" required>
          </div>

          <h3>Perfil</h3>
          <div class="select-profile">
            <select id="profile" name="perfil" required>
              <option value="" disabled selected hidden>Seleccionar Perfil</option>
              <option value="Administrador">Administrador</option>
              <option value="Empleado">Empleado</option>
            </select>
          </div>

          <p id="mensaje" class="form-message" role="status" aria-live="polite"></p>

          <div class="ingresar">
            <button type="submit" class="submit">Registrarme</button>
          </div>

          <p>¿Ya tienes una cuenta?</p>
          <div class="register-link">
            <a href="index.html">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>

    <!-- LADO DERECHO: Fondo Blanco con el Logo -->
    <div class="left-panel">
      <img src="img/logo.png" alt="Logo de ConstrucCalc" class="logo">
    </div>

  </div>
  <script src="auth.js" defer></script>
</body>
</html>
